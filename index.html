<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/niftypulse-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NiftyPulse Financial Dashboard</title>
    <meta
      name="description"
      content="Follow Indian market indices and stocks with live quotes, interactive charts, market breadth, and a customizable watchlist."
    />
    <meta name="theme-color" content="#071711" />
    <link rel="canonical" href="https://nifty-pulse-seven.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nifty-pulse-seven.vercel.app/" />
    <meta property="og:site_name" content="NiftyPulse" />
    <meta property="og:title" content="NiftyPulse — Indian Markets Live" />
    <meta
      property="og:description"
      content="Live Indian market quotes, interactive charts, and a watchlist in one polished dashboard."
    />
    <meta
      property="og:image"
      content="https://nifty-pulse-seven.vercel.app/niftypulse-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="NiftyPulse Indian Markets Live dashboard preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NiftyPulse — Indian Markets Live" />
    <meta
      name="twitter:description"
      content="Live Indian market quotes, interactive charts, and a watchlist in one polished dashboard."
    />
    <meta
      name="twitter:image"
      content="https://nifty-pulse-seven.vercel.app/niftypulse-preview.png"
    />
    <meta name="twitter:image:alt" content="NiftyPulse Indian Markets Live dashboard preview" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('niftypulse-theme');
          if (t !== 'light' && t !== 'dark') t = 'light';
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
